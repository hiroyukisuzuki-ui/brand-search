<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブランド検索</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F6">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#16202A; --sub:#5E6B78; --line:#DDE2E7; --fill:#E6EAEE;
  --ok:#1F8A4C; --mid:#C27A0E; --ng:#C23A3A;
  --rS:#B8892B; --rA:#C8402F; --rB:#D9772A; --rC:#2F6FB5; --rD:#2C8C8C; --rE:#5A57B0; --rF:#7C8792; --rG:#A3ACB5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#18212A; --ink:#E8EDF2; --sub:#94A1AE; --line:#26313C; --fill:#222D38;
    --ok:#4CC27D; --mid:#E8A53A; --ng:#EB6B6B; --rG:#66717C; --rF:#57616B;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --ink:#E8EDF2; --sub:#94A1AE; --line:#26313C; --fill:#222D38;
  --ok:#4CC27D; --mid:#E8A53A; --ng:#EB6B6B; --rG:#66717C; --rF:#57616B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
h1{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 8px;letter-spacing:.02em}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:14px;padding:0 12px;height:52px}
.search:focus-within{border-color:var(--ink)}
.search svg{flex:none;color:var(--sub)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;height:100%}
.clear{border:0;background:var(--fill);color:var(--sub);width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;display:none}
.clear.show{display:block}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.rank{width:38px;padding:6px 0;text-align:center}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
.count{font-size:13px;color:var(--sub);margin:8px 2px 6px;display:flex;justify-content:space-between}
.count button{border:0;background:none;color:var(--rC);font:inherit;font-size:13px;cursor:pointer;padding:0}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.badge{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:22px;background:var(--c)}
.names{flex:1;min-width:0}
.en{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ja{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.net{flex:none;text-align:center;font-size:11px;color:var(--sub);width:44px}
.net b{display:block;font-size:20px;line-height:1.1}
.net.ok b{color:var(--ok)} .net.mid b{color:var(--mid)} .net.ng b{color:var(--ng)}
mark{background:none;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.more{display:block;width:100%;margin-top:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.empty{background:var(--surface);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
:focus-visible{outline:2px solid var(--rC);outline-offset:2px}
</style>
</head>

const PAGE = 100;

function norm(s){
  s = (s||"").normalize("NFKC").toLowerCase();
  s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC");      // é→e
  s = s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60)); // ひらがな→カタカナ
  return s.replace(/[^\p{L}\p{N}]/gu,"");                                         // 空白・記号を無視
}
DATA.forEach(b => { b.ek = norm(b.en); b.jk = norm(b.ja); });

const $ = id => document.getElementById(id);
const q = $("q"), out = $("out");
const state = { ranks:new Set(), nets:new Set(), shown:PAGE };
$("total").textContent = "(" + DATA.length.toLocaleString() + "件)";

// フィルター
const f = $("filters");
RANKS.forEach(r => f.appendChild(chip(r, "rank", `var(--r${r})`, () => toggle(state.ranks, r))));
f.appendChild(Object.assign(document.createElement("span"),{className:"sep"}));
NETS.forEach(([n,cls,label]) => f.appendChild(chip(`ネット${n}`, "", `var(--${cls})`, () => toggle(state.nets, n))));
function chip(text, cls, color, onClick){
  const b = document.createElement("button");
  b.className = "chip " + cls; b.textContent = text; b.style.setProperty("--c", color);
  b.setAttribute("aria-pressed","false");
  b.onclick = () => { onClick(); b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true"); };
  return b;
}
function toggle(set, v){ set.has(v) ? set.delete(v) : set.add(v); state.shown = PAGE; render(); }

$("reset").onclick = () => {
  state.ranks.clear(); state.nets.clear(); state.shown = PAGE;
  f.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false")); render();
};
$("clear").onclick = () => { q.value = ""; q.focus(); state.shown = PAGE; render(); };
let t; q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { state.shown = PAGE; render(); }, 60); });

function search(){
  const k = norm(q.value);
  const res = [];
  for (const b of DATA){
    if (state.ranks.size && !state.ranks.has(b.rank)) continue;
    if (state.nets.size && !state.nets.has(b.net)) continue;
    let s;
    if (!k) s = 3;
    else if (b.ek === k || b.jk === k) s = 0;
    else if (b.ek.startsWith(k) || b.jk.startsWith(k)) s = 1;
    else if (b.ek.includes(k) || b.jk.includes(k)) s = 2;
    else continue;
    res.push([s,b]);
  }
  res.sort((a,b) => a[0]-b[0] || a[1].id-b[1].id);
  return res.map(x => x[1]);
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text){
  const raw = q.value.trim();
  if (!raw) return esc(text);
  const i = text.toLowerCase().indexOf(raw.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+raw.length)) + "</mark>" + esc(text.slice(i+raw.length));
}
function row(b){
  const n = NETS.find(x => x[0]===b.net);
  const title = b.en || b.ja, sub = b.en ? b.ja : "";
  return `<li><div class="badge" style="--c:var(--r${b.rank}, var(--rG))" aria-label="買取ランク${b.rank}">${esc(b.rank)}</div>
    <div class="names"><div class="en">${hl(title)}</div>${sub?`<div class="ja">${hl(sub)}</div>`:""}</div>
    <div class="net ${n?n[1]:""}"><b>${n?n[0]:"—"}</b>${n?n[2]:"不明"}</div></li>`;
}
function render(){
  $("clear").classList.toggle("show", !!q.value);
  $("reset").hidden = !(state.ranks.size || state.nets.size);
  const res = search();
  $("count").textContent = res.length.toLocaleString() + " 件";
  if (!res.length){
    out.innerHTML = `<div class="empty">「${esc(q.value)}」に一致するブランドはありません。<br>綴りの一部だけ(例: ルイ、vuit)でも検索できます。</div>`;
    return;
  }
  out.innerHTML = "<ul>" + res.slice(0,state.shown).map(row).join("") + "</ul>" +
    (res.length > state.shown ? `<button class="more" id="more">さらに表示(残り ${(res.length-state.shown).toLocaleString()} 件)</button>` : "");
  const m = $("more"); if (m) m.onclick = () => { state.shown += PAGE * 3; render(); };
}
render();

// オフライン対応(GitHub Pages などに置いたとき有効)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
